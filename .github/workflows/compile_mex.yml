name: Compile MEX
on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.hpp'
      # Vendored toolboxes (fieldtrip, bemcp, ctf, ...) ship precompiled MEX and
      # are not built by `make -C src`, so their changes must not trigger this.
      - '!external/**'

jobs:
  compile_mex:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # On Linux, the OS version should be as old as possible for mex compatibility.
          - os: ubuntu-22.04
            os_name: Linux
            mex_ext: mexa64
            matlab_release: R2020a
            matlab_legacy: true
          # On Mac and Windows the Matlab version drives mex compatibility, but macos-latest
          # is avoided because its Xcode 26 linker cannot link C++ MEX files for R2023b.
          - os: macos-15-intel
            os_name: macOS_Intel
            mex_ext: mexmaci64
            matlab_release: R2020a
            matlab_legacy: true
          - os: macos-15
            os_name: macOS_Apple_Silicon
            mex_ext: mexmaca64
            matlab_release: R2023b
            matlab_legacy: false
          - os: windows-latest
            os_name: Windows
            mex_ext: mexw64
            matlab_release: R2022a
            matlab_legacy: true

    steps:
    
      - name: Configure MinGW
        # GitHub Actions provides MinGW in C:\mingw64 but MATLAB on Windows
        # does not automatically detect it. Explicitly set MW_MINGW64_LOC.      
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "MW_MINGW64_LOC=C:\mingw64" >> $env:GITHUB_ENV
    
      - name: Set up MATLAB (legacy)
        if: ${{ matrix.matlab_legacy }}
        uses: matlab-actions/setup-matlab@e6b241a42928104e9e489fcc63aa2915df01565f # v1.2.5, kept for the older MATLAB releases
        with:
          release: ${{ matrix.matlab_release }}
      - name: Set up MATLAB
        if: ${{ !matrix.matlab_legacy }}
        uses: matlab-actions/setup-matlab@2323adb8243827ea460b0def4c413545aaec46a9 # v3.0.2
        with:
          release: ${{ matrix.matlab_release }}
      - name: Checkout SPM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete old MEX files on Ubuntu and Mac
        if: matrix.os != 'windows-latest'
        run: find . -type f -name "*.mex*" -delete

      - name: Delete old MEX files on Windows
        if: matrix.os == 'windows-latest'
        run: Get-ChildItem -Path .\ -Recurse -Include *.mex* | Remove-Item -Force

      - name: Compile MEX files
        run: |
          make -C src distclean
          make -C src
          make -C src install
          # make -C src external-distclean # on windows there is an issue with fieldtrip
          # make -C src external
          # make -C src external-install

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spm-mex-${{ matrix.os_name }}
          path: ./**/*.${{ matrix.mex_ext }}
          retention-days: 1

  collect_mex_files:
    runs-on: ubuntu-latest
    needs: compile_mex
    steps:
      - name: Download all MEX artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: spm-mex-*
          merge-multiple: true

      - name: Upload all mex files as Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spm-mex-all
          path: .
