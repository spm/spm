name: Tests
on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'
    - cron: '40 16 * * 3'
jobs:
  configure:
    name: Configure test matrix (PR uses limited MATLAB versions)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      is-pr: ${{ steps.config.outputs.is-pr }}
    steps:
      - name: Determine test configuration
        id: config
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          import json, os

          # Oldest release tested per OS. R2020b is the oldest that MATLAB's CI licensing
          # supports, Windows MEX compilation needs R2022a, Apple Silicon starts at R2023b.
          # macos-15-intel is Intel and ends at R2025b, MATLAB's last Intel Mac release.
          FIRST = {"ubuntu-latest": "R2020b", "macos-15-intel": "R2020b",
                   "windows-latest": "R2022a", "macos-15": "R2023b"}
          LAST_INTEL = "R2025b"
          RELEASES = ["R2020b", "R2021a", "R2021b", "R2022a", "R2022b", "R2023a", "R2023b",
                      "R2024a", "R2024b", "R2025a", "R2025b", "latest"]

          def job(os_name, version, regression):
              return {"os": os_name, "version": version, "regression": regression}

          def tested(os_name, version):
              if version == "latest":
                  return os_name != "macos-15-intel"
              return FIRST[os_name] <= version and (os_name != "macos-15-intel" or version <= LAST_INTEL)

          event = os.environ["EVENT_NAME"]
          quick = event == "pull_request" or os.environ["EVENT_SCHEDULE"] == "15 3 * * *"
          # macos-latest (macOS 26) only runs the newest releases, because its Xcode 26
          # linker cannot link C++ MEX files for R2023b-R2025a.
          if quick:
              # Oldest and newest release on Linux and Windows. macOS jobs are the slowest
              # and limited to 5 at a time across the organisation, so there is one Intel
              # job with the oldest release and one Apple Silicon job with the newest.
              # Regression tests are much slower than unit tests and run in a single job.
              jobs = [job(o, v, o == "ubuntu-latest" and v == "latest")
                      for o in ("ubuntu-latest", "windows-latest") for v in (FIRST[o], "latest")]
              jobs += [job("macos-15-intel", FIRST["macos-15-intel"], False),
                       job("macos-latest", "latest", False)]
          else:
              jobs = [job(o, v, True) for o in FIRST for v in RELEASES if tested(o, v)]
              jobs += [job("macos-latest", v, True) for v in ("R2025b", "latest")]

          # is-pr gates the test data checkout, not which tests run: spm-tests-data is
          # private and its token is unavailable to pull requests from forks.
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("is-pr=" + ("true" if event == "pull_request" else "false"), file=f)
              print("matrix=" + json.dumps({"include": jobs}), file=f)
          for j in jobs:
              print(j["os"], j["version"], "regression" if j["regression"] else "")

  matlab-tests:
    name: Run MATLAB Tests (${{ matrix.version }}, ${{ matrix.os }})
    needs: configure
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}
    runs-on: ${{matrix.os}}
    # Stops a hung job exhausting the 6h workflow limit and cancelling its siblings.
    timeout-minutes: 120
    env:
      cache-key: tests-data2
    steps:
      - name: Install Visual C++ 2010 Redistributable (required by FieldTrip MEX files)
        if: runner.os == 'Windows'
        run: choco install vcredist2010 -y
        
      - name: Configure MinGW
        # GitHub Actions provides MinGW in C:\mingw64 but MATLAB on Windows
        # does not automatically detect it. Explicitly set MW_MINGW64_LOC.      
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "MW_MINGW64_LOC=C:\mingw64" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest commit for tests data  # shallow fetch to get revision
        id: checkout-tests-data
        if: ${{ needs.configure.outputs.is-pr == 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spm/spm-tests-data
          token: ${{ secrets.TESTS_DATA_REPO_TOKEN }}
          path: tests/data
          fetch-depth: 1
          lfs: false
      - name: Remove shallow-checked-out repo
        if: ${{ needs.configure.outputs.is-pr == 'false' }}
        shell: bash
        run: rm -rf tests/data
      - name: Try to retrieve commit from cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/data
          key: ${{ env.cache-key }}-${{ steps.checkout-tests-data.outputs.commit }}
          restore-keys: ${{ env.cache-key }}
          enableCrossOsArchive: true
      - name: If cache missed, pull latest commit...
        id: checkout-tests-data-lfs
        if: ${{ needs.configure.outputs.is-pr == 'false' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spm/spm-tests-data
          token: ${{ secrets.TESTS_DATA_REPO_TOKEN }}
          path: tests/data
          lfs: true
      - name: ... and cache latest commit
        if: ${{ needs.configure.outputs.is-pr == 'false' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/data
          key: ${{ env.cache-key }}-${{ steps.checkout-tests-data.outputs.commit }}

      - name: Verify test data available
        shell: bash
        run: |
          if [ ! -d "tests/data" ] || [ -z "$(ls -A tests/data)" ]; then
            echo "::error::Test data not available. Cache may be empty or expired."
            exit 1
          fi

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@2323adb8243827ea460b0def4c413545aaec46a9 # v3.0.2
        with:
          release: ${{ matrix.version }}

      - name: Select test classes
        id: classes
        shell: bash
        env:
          REGRESSION: ${{ matrix.regression }}
        run: |
          UNIT="u = spm_tests('class','unit','display',true);"
          REGR="r = spm_tests('class','regression','display',true);"
          if [ "$REGRESSION" = "true" ]; then
            echo "command=addpath(pwd); $UNIT $REGR assert(all(~[u.Failed]) && all(~[r.Failed]));" >> $GITHUB_OUTPUT
          else
            echo "command=addpath(pwd); $UNIT assert(all(~[u.Failed]));" >> $GITHUB_OUTPUT
          fi

      - name: Run tests with existing MEX files
        uses: matlab-actions/run-command@75644028e1e2aa374bbfdc968a65718a178cc264 # v3.2.1
        with:
          command: ${{ steps.classes.outputs.command }}

      - name: Compile MEX files
        run: |
          make -C src distclean
          make -C src
          make -C src install
        # make -C src external-distclean
        # make -C src external
        # make -C src external-install
      - name: Get MEX extension on Linux/macOS
        if: runner.os != 'Windows'
        run: echo "MEXEXT=$(mexext)" >> $GITHUB_ENV
      - name: Get MEX extension on Windows
        if: runner.os == 'Windows'
        run: echo "MEXEXT=$(mexext.bat)" >> $env:GITHUB_ENV
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spm-${{env.MEXEXT}}-${{runner.os}}-${{matrix.version}}
          path: ./**/*.${{env.MEXEXT}}
          retention-days: 1

  tests-passed:
    name: Tests passed
    needs: matlab-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job did not succeed
        if: needs.matlab-tests.result != 'success'
        run: exit 1
      - run: echo "All required test jobs passed."
