version: 2
updates:
  # One grouped pull request per month for all action pins.
  # The ignored action below is reviewed by hand instead, roughly once a year.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # Used only in release.yml, so no pull request exercises it and a bad
      # version would first surface during a release.
      - dependency-name: "softprops/action-gh-release"
